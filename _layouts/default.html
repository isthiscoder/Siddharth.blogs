<!doctype html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  {% include header.html %}
  <main class="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    {% include social.html %}
           <p class="copyline">&copy; {{ 'now' | date: "%Y" }} {{ site.author }}. All rights reserved.</p>
  </footer>

  <div class="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="v-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
    <button class="v-prev" type="button" aria-label="Previous photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
    <figure class="v-stage">
      <img class="v-img" alt="">
      <figcaption class="v-cap">
        <span class="v-title"></span>
        <span class="v-sub"><time class="v-date"></time><a class="v-post" href="#">View post</a><span class="v-count"></span></span>
      </figcaption>
    </figure>
    <button class="v-next" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
  </div>
  <script src="{{ '/assets/js/viewer.js' | relative_url }}" defer></script>
</body>
</html>
