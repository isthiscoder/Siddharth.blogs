<header class="masthead">
  <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav class="sections" aria-label="Sections">
    {%- for s in site.sections -%}
    {%- assign here = page.url | slice: 0, s.url.size -%}
    <a href="{{ s.url | relative_url }}"{% if here == s.url %} aria-current="page"{% endif %}>{{ s.name }}</a>
    {%- endfor -%}
  </nav>
</header>
